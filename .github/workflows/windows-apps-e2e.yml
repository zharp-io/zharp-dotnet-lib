name: Windows apps end to end

# WPF and Windows Forms (.NET 10, and .NET Framework 4.8) sample apps (e2e/desktop) built in
# Release with Zharp.Build uploading to a stand-in Zharp, run without their PDBs (as apps ship),
# through: a caught error, an exception on the UI thread, a crash while offline (sent on the next
# launch), and a hang. What arrived is checked, and kept as a workflow artifact.
on:
  workflow_dispatch:
  push:
    branches: [main, feat/apps]
    paths: ['src/**', 'e2e/desktop/**', 'e2e/mock_zharp.py', '.github/workflows/windows-apps-e2e.yml']

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack the Zharp packages
        run: dotnet pack Zharp.sln -c Release -o artifacts/packages

      - name: Build the apps in Release (Zharp.Build uploads to the stand-in)
        shell: pwsh
        env:
          ZHARP_AUTH_TOKEN: zat_desktop_e2e
          ZHARP_APP_ID: "7"
          ZHARP_URL: http://127.0.0.1:4318
        run: |
          $out = "$env:RUNNER_TEMP/build"
          $mock = Start-Process python -ArgumentList "e2e/mock_zharp.py", $out -PassThru
          Start-Sleep 2
          dotnet build e2e/desktop/WpfApp -c Release
          dotnet build e2e/desktop/FormsApp -c Release
          Stop-Process -Id $mock.Id
          Get-ChildItem "$out/artifacts" | ForEach-Object Name
          foreach ($name in "WpfApp", "FormsApp") {
            $pdbs = @(Get-ChildItem "$out/artifacts" -Filter "portable-pdb-*-$name.pdb")
            $bundles = @(Get-ChildItem "$out/artifacts" -Filter "source-bundle-*.json")
            if (-not $pdbs.Count) { throw "no portable PDB uploaded for $name" }
            if (-not $bundles.Count) { throw "no source bundle uploaded" }
          }
          $fields = Get-Content (Get-ChildItem "$out/artifacts" -Filter "portable-pdb-*-WpfApp.pdb.json")[0].FullName | ConvertFrom-Json
          if ($fields.auth -ne "Bearer zat_desktop_e2e" -or $fields.path -ne "/api/v1/applications/7/artifacts") { throw "the upload went to the wrong place: $($fields | ConvertTo-Json)" }
          # Apps ship without their PDBs: the runtime finds no lines.
          Get-ChildItem e2e/desktop/*/bin -Recurse -Filter *.pdb | Remove-Item -Force

      - name: WPF (.NET 10)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/wpf/artifacts" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/build/artifacts/*" "$env:RUNNER_TEMP/wpf/artifacts/"
          ./e2e/desktop/check.ps1 -Exe e2e/desktop/WpfApp/bin/Release/net10.0-windows/WpfApp.exe -Name WpfApp -Out "$env:RUNNER_TEMP/wpf" -UiError handled

      - name: Windows Forms (.NET 10)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/forms/artifacts" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/build/artifacts/*" "$env:RUNNER_TEMP/forms/artifacts/"
          ./e2e/desktop/check.ps1 -Exe e2e/desktop/FormsApp/bin/Release/net10.0-windows/FormsApp.exe -Name FormsApp -Out "$env:RUNNER_TEMP/forms" -UiError ui-error

      - name: Windows Forms (.NET Framework 4.8)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/forms48/artifacts" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/build/artifacts/*" "$env:RUNNER_TEMP/forms48/artifacts/"
          ./e2e/desktop/check.ps1 -Exe e2e/desktop/FormsApp/bin/Release/net48/FormsApp.exe -Name FormsApp -Out "$env:RUNNER_TEMP/forms48" -UiError ui-error

      - name: Keep what was sent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-sent
          path: |
            ${{ runner.temp }}/build
            ${{ runner.temp }}/wpf*
            ${{ runner.temp }}/forms*
